name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Run acceptance gate
        run: npm run check

  action-smoke:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run AIFileDetector
        id: detector
        uses: ./
      - name: Verify Action outputs
        env:
          RESULT: ${{ steps.detector.outputs.result }}
          VIOLATION_COUNT: ${{ steps.detector.outputs.violation-count }}
          REPORT_PATH: ${{ steps.detector.outputs.report-path }}
        run: |
          test "$RESULT" = "compliant"
          test "$VIOLATION_COUNT" = "0"
          test -f "$REPORT_PATH"
